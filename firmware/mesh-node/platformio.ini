; PropMesh mesh testbed — flashable on the devkits on hand.
; Uses the pioarduino platform (arduino-esp32 core 3.x). The legacy
; `espressif32` platform is frozen on core 2.x and will NOT build this.
;
;   pio run -e supermini-c3 -t upload      # ESP32-C3 Super Mini (Mini stand-in)
;   pio run -e esp32-devkit -t upload      # classic devkit (bridge stand-in)
;   pio run -e c6-devkit    -t upload
;
; All nodes must share PM_CHANNEL. Serial monitor at 115200 shows
; heartbeats from every other node with per-hop RSSI.

[platformio]
default_envs = supermini-c3

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../common
build_flags =
	-DPM_CHANNEL=1
	-DPM_NET_ID=0xCAFE

[env:supermini-c3]
board = esp32-c3-devkitm-1
build_flags =
	${env.build_flags}
	-DARDUINO_USB_MODE=1		; C3/C6 console is HW CDC/JTAG, not TinyUSB
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DPM_LED_PIN=8			; Super Mini onboard LED (active low)
	-DPM_LED_ACTIVE_LOW=1

[env:esp32-devkit]
board = esp32doit-devkit-v1
build_flags =
	${env.build_flags}
	-DPM_LED_PIN=2

[env:c6-devkit]
board = esp32-c6-devkitm-1
build_flags =
	${env.build_flags}
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
