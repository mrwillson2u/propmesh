; Host-native unit tests for the pure mesh logic — no hardware, runs in CI.
;
;   pio test -e native
;
; The units under test (pm_dedup.h, pm_neighbors.h, pm_time.h, and the
; generic-board pin rules + config codec) are
; header-only and free of Arduino/ESP includes precisely so they can be
; exercised here. Anything needing a radio is tested on the devkits.

[env:native]
platform = native
test_framework = unity
build_flags =
	-std=gnu++17
	-I ../common/propmesh/src
	-I ../common/propmesh-node/src
lib_deps = bblanchon/ArduinoJson@^7.2.0
