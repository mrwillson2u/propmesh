; PropMesh node firmware for generic boards — pins are assigned from the
; console, not compiled in. docs/generic-boards.md.
;
;   pio run -e esp32-devkit-v1 -t upload -t monitor
;
; One env per board profile in boards/*.yaml; PM_BOARD_PROFILE selects
; the generated pin table (boards_gen.h). All nodes must share
; PM_CHANNEL and PM_NET_ID with the rest of the mesh.
;
; Every env carries the same features (mesh, OTA, Bluetooth floods, deep
; sleep, strips). On the ESP32 that is 128 KB of IRAM nearly full: until
; 2026-10-11 each build dropped one (-DPM_NO_SLEEP / -DPM_NO_BLE) because
; the Adafruit_NeoPixel path linked ~1 KB of RMT code strips don't use;
; pm_ws2812 fixed that. If a build overflows IRAM again, those two flags
; still work, and `pio run -v` + firmware.map say who grew.

[platformio]
default_envs = esp32-devkit-v1

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 921600
board_build.filesystem = littlefs
; Two 1.9 MB app slots (OTA needs two) and a 192 kB filesystem — our
; config and show JSON are a few kB. The default table's 1.25 MB slots
; were 96 % full by 2026-10-07. Changing this needs one USB flash and
; wipes the filesystem (back the configs up first).
board_build.partitions = min_spiffs.csv
lib_extra_dirs = ../common
; Stamps PM_BUILD (git commit) and writes version.json beside firmware.bin.
extra_scripts = pre:build_id.py
build_flags =
	-DPM_CHANNEL=1
	-DPM_NET_ID=0xCAFE
	-DPM_SERIAL_BAUD=921600
	; The loop task has an 8 KB stack. A big object built on it (a
	; `show = PmShow()` temporary, 19 KB) crash-looped every board on
	; 2026-10-05 — make the compiler point at any frame over 3 KB.
	-Wframe-larger-than=3072
lib_deps =
	bblanchon/ArduinoJson@^7.2.0
	; Fire2023's noise + palette math only (pm_fire.cpp) — never its output
	; driver: that bakes the pin in at compile time, and we assign pins
	; from the console. Pinned: 3.10.7 doesn't compile on this core
	; (its SD shim vs the core's SD library), 3.10.3 does. Costs ~11 KB
	; flash and no IRAM (measured 2026-10-11).
	fastled/FastLED@3.10.3

[env:esp32-devkit-v1]
board = esp32doit-devkit-v1
build_flags =
	${env.build_flags}
	-DPM_BOARD_PROFILE=PM_BOARD_ESP32_DEVKIT_V1

; Adafruit HUZZAH32 (ESP32 Feather): LiPo input with charger, battery
; sense on GPIO 35 — the battery-board stand-in (boards/esp32-huzzah32.yaml).
[env:esp32-huzzah32]
board = featheresp32
build_flags =
	${env.build_flags}
	-DPM_BOARD_PROFILE=PM_BOARD_ESP32_HUZZAH32

; ESP32-C6 SuperMini: tiny RISC-V board, native USB (the console is the
; USB-JTAG port, so Serial needs CDC-on-boot), LP GPIO 0-7 wake it from
; deep sleep (boards/esp32-c6-supermini.yaml). Bluetooth floods go through
; NimBLE here (no VHCI in the C6 libs) and fit beside deep sleep.
[env:esp32-c6-supermini]
board = esp32-c6-devkitm-1
build_flags =
	${env.build_flags}
	-DPM_BOARD_PROFILE=PM_BOARD_ESP32_C6_SUPERMINI
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
