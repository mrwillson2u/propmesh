; PropMesh node firmware for generic boards — pins are assigned from the
; console, not compiled in. docs/generic-boards.md.
;
;   pio run -e esp32-devkit-v1 -t upload -t monitor
;
; One env per board profile in boards/*.yaml; PM_BOARD_PROFILE selects
; the generated pin table (boards_gen.h). All nodes must share
; PM_CHANNEL and PM_NET_ID with the rest of the mesh.

[platformio]
default_envs = esp32-devkit-v1

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 921600
board_build.filesystem = littlefs
; Two 1.9 MB app slots (OTA needs two) and a 192 kB filesystem — our
; config and show JSON are a few kB. The default table's 1.25 MB slots
; were 96 % full by 2026-10-07. Changing this needs one USB flash and
; wipes the filesystem (back the configs up first).
board_build.partitions = min_spiffs.csv
lib_extra_dirs = ../common
; Stamps PM_BUILD (git commit) and writes version.json beside firmware.bin.
extra_scripts = pre:build_id.py
build_flags =
	-DPM_CHANNEL=1
	-DPM_NET_ID=0xCAFE
	-DPM_SERIAL_BAUD=921600
	; The loop task has an 8 KB stack. A big object built on it (a
	; `show = PmShow()` temporary, 19 KB) crash-looped every board on
	; 2026-10-05 — make the compiler point at any frame over 3 KB.
	-Wframe-larger-than=3072
lib_deps =
	bblanchon/ArduinoJson@^7.2.0
	adafruit/Adafruit NeoPixel@^1.12.3

[env:esp32-devkit-v1]
board = esp32doit-devkit-v1
build_flags =
	${env.build_flags}
	-DPM_BOARD_PROFILE=PM_BOARD_ESP32_DEVKIT_V1

; Adafruit HUZZAH32 (ESP32 Feather): LiPo input with charger, battery
; sense on GPIO 35 — the battery-board stand-in (boards/esp32-huzzah32.yaml).
[env:esp32-huzzah32]
board = featheresp32
build_flags =
	${env.build_flags}
	-DPM_BOARD_PROFILE=PM_BOARD_ESP32_HUZZAH32
