# Sheet 01 — Power: connection spec.  ONE LINE PER NET.
#
# This is the drawing guide before capture and the checker afterwards:
#   python3 tools/checknet.py hardware/pro/sheets/01-power.net.yaml
# diffs it against `kicad-cli sch export netlist` of the real schematic.
#
# Refs here are the sheet's descriptive names (C_bulk, R_FB1). KiCad will
# assign its own (C7, R12) — that is fine: the checker matches parts by
# VALUE, treating identical-value parts as interchangeable (two 10 µF caps
# in parallel are). So set each symbol's Value field to the value below.
#
# Pin ids are KiCad's: named pins by name (U1.VIN, Q1.G, D_Z.K), unnamed
# passives by number (R1.1). Polarised cap: 1 = +, 2 = −.

sheet: 01-power

# `footprint:` is what the schematic part must carry (Tools → Assign Footprints);
# the checker verifies it. Generic packages use KiCad's stock libraries; the four
# vendor-specific ones were imported from LCSC into hardware/lib/propmesh.pretty.
_fp: &fp
  r0603:  &r0603  "Resistor_SMD:R_0603_1608Metric"
  c0603:  &c0603  "Capacitor_SMD:C_0603_1608Metric"
  c0805:  &c0805  "Capacitor_SMD:C_0805_2012Metric"
  c1206:  &c1206  "Capacitor_SMD:C_1206_3216Metric"
  c1210:  &c1210  "Capacitor_SMD:C_1210_3225Metric"
  led0603: &led0603 "LED_SMD:LED_0603_1608Metric"

parts:
  U1:     {value: AP64350SP-13,  lcsc: C2071691, symbol: "propmesh:AP64350SP-13",            footprint: "propmesh:SO-8_L4.9-W3.9-P1.27-LS6.0-BL-EP"}
  U2:     {value: TLV62569DBV,   lcsc: C141836,  symbol: "Regulator_Switching:TLV62569DBV",  footprint: "Package_TO_SOT_SMD:SOT-23-5"}
  L1:     {value: 6.8uH,         lcsc: C149542,  symbol: "Device:L",  footprint: "propmesh:IND-SMD_L11.5-W10.0", note: "SMMS1050-6R8M, 11.5×10 mm — footprint imported from LCSC 2026-09-03"}
  L2:     {value: 2.2uH,         lcsc: C149580,  symbol: "Device:L",  footprint: "propmesh:IND-SMD_L7.1-W6.6",   note: "SMMS0650-2R2M, 6.6×7.1 mm — footprint imported from LCSC 2026-09-03"}
  C1a:    {value: 10uF/100V,     lcsc: C5156756, symbol: "Device:C",  footprint: *c1210}
  C1b:    {value: 10uF/100V,     lcsc: C5156756, symbol: "Device:C",  footprint: *c1210}
  C_bulk: {value: 100uF/63V,     lcsc: C7471890, symbol: "Device:C_Polarized", footprint: "Capacitor_SMD:CP_Elec_8x10.5"}
  C2a:    {value: 22uF,          lcsc: C7472972, symbol: "Device:C",  footprint: *c1206}
  C2b:    {value: 22uF,          lcsc: C7472972, symbol: "Device:C",  footprint: *c1206}
  C3:     {value: 100nF,         lcsc: C14663,   symbol: "Device:C",  footprint: *c0603, note: "Yageo CC0603KRX7R9BB104, 50 V X7R — JLC BASIC (the Samsung CL10B104KB8NNNC C1591 is Extended)"}
  C4:     {value: DNP,           lcsc: ~,        symbol: "Device:C",  footprint: *c0603, dnp: true}
  C5:     {value: 3.3nF,         lcsc: C1613,    symbol: "Device:C",  footprint: *c0603}
  C6:     {value: 47pF,          lcsc: C1671,    symbol: "Device:C",  footprint: *c0603}
  C_in:   {value: 10uF/16V,      lcsc: C95841,   symbol: "Device:C",  footprint: *c0805}
  C_out:  {value: 22uF,          lcsc: C7472972, symbol: "Device:C",  footprint: *c1206}
  C_FF:   {value: 6.8pF,         lcsc: C318672,  symbol: "Device:C",  footprint: *c0603}
  R1:     {value: 115k,          lcsc: C22783,   symbol: "Device:R",  footprint: *r0603, note: "0603WAF1153T5E — Extended (E96 value)"}
  R2:     {value: 22.1k,         lcsc: C25961,   symbol: "Device:R",  footprint: *r0603, note: "0603WAF2212T5E — Extended (E96 value)"}
  RT:     {value: 200k,          lcsc: C25811,   symbol: "Device:R",  footprint: *r0603, note: "0603WAF2003T5E — BASIC"}
  R5:     {value: 14k,           lcsc: C22803,   symbol: "Device:R",  footprint: *r0603, note: "0603WAF1402T5E — Extended (E96 value)"}
  R_FB1:  {value: 453k,          lcsc: C25818,   symbol: "Device:R",  footprint: *r0603, note: "0603WAF4533T5E — Extended (E96 value)"}
  R_FB2:  {value: 100k,          lcsc: C25803,   symbol: "Device:R",  footprint: *r0603, note: "0603WAF1003T5E — BASIC"}
  R_G:    {value: 100k,          lcsc: C25803,   symbol: "Device:R",  footprint: *r0603, note: "same part as R_FB2"}
  R_5V:   {value: 680R,          lcsc: C23228,   symbol: "Device:R",  footprint: *r0603, note: "0603WAF6800T5E — BASIC"}
  R_3V3:  {value: 680R,          lcsc: C23228,   symbol: "Device:R",  footprint: *r0603, note: "same part as R_5V"}
  Q1:     {value: AOD4185,       lcsc: C400894,  symbol: "Transistor_FET:SUD50P04-08",   footprint: "Package_TO_SOT_SMD:TO-252-2", note: "SYMBOL CHANGED 2026-09-06: KiCad 10 Device:Q_PMOS numbers its pins D/G/S, which match NO footprint pad — the FET would have been left unconnected. SUD50P04-08 is a stock DPAK P-FET symbol numbered 1=G 2=D 3=S, the AOD4185 datasheet order (top view: G left, D tab, S right). Value stays AOD4185"}
  D_Z:    {value: BZT52C10,      lcsc: C5566143, symbol: "Device:D_Zener",  footprint: "Diode_SMD:D_SOD-123"}
  D1:     {value: SMAJ33A,       lcsc: C383696,  symbol: "Device:D_Zener",  footprint: "Diode_SMD:D_SMA", note: "unidirectional TVS — D_TVS symbol is bidirectional, do not use"}
  D_5V:   {value: LED_BLUE,      lcsc: C965807,  symbol: "Device:LED",      footprint: *led0603, note: "XINGLIGHT XL-1608UBC-04 — blue 470 nm, Vf 3.3 V @20 mA, verified on LCSC 2026-09-03"}
  D_3V3:  {value: LED_YELLOW,    lcsc: C965805,  symbol: "Device:LED",      footprint: *led0603, note: "XINGLIGHT XL-1608SYGC-06 — yellow-green 575 nm, Vf 2.2 V, verified on LCSC 2026-09-03"}
  F1:     {value: 7.5A,          lcsc: C206907,  symbol: "Device:Fuse",     footprint: "propmesh:01530008Z", note: "Littelfuse 01530008Z MINI blade holder — footprint imported from LCSC 2026-09-03"}
  J1:     {value: DC_IN,         lcsc: C711349,  symbol: "Connector:Screw_Terminal_01x02", footprint: "propmesh:CONN-TH_DG128-5.0-02P-14-00A-H", note: "DEGSON DG128-5.0-02P — footprint imported from LCSC 2026-09-03"}
  J2:     {value: DC_JACK,       lcsc: C129006,  symbol: "Connector:Barrel_Jack_Switch",   footprint: "propmesh:DC-IN-TH_DC-044A-20A", note: "DC-044A-20A 30 V/5 A barrel, Ø2.0 pin (5.5×2.1 plugs); Ø2.5-pin -25A variant is a drop-in on the same pads. Pads 4/5 are housing lugs — leave unconnected. Pins 2 AND 3 both to GND so sleeve/switch assignment cannot matter"}
  JP_VIN:  {value: JP_VIN, lcsc: C124375, symbol: "Connector_Generic:Conn_01x02", footprint: "Connector_PinHeader_2.54mm:PinHeader_1x02_P2.54mm_Vertical", note: "STAGED-POWER LINK (spec 2.6, added 2026-09-07): 2-pin header + shunt C100114 between VIN_PROT and the 5 V buck input. Pull the shunt = buck isolated; meter across = input current"}
  JP_5V:   {value: JP_5V,   lcsc: C124375, symbol: "Connector_Generic:Conn_01x02", footprint: "Connector_PinHeader_2.54mm:PinHeader_1x02_P2.54mm_Vertical", note: "buck output -> +5V rail. Carries the full 3 A rail: pour to both pins; header is rated 3 A"}
  JP_3V3:  {value: JP_3V3, lcsc: C124375, symbol: "Connector_Generic:Conn_01x02", footprint: "Connector_PinHeader_2.54mm:PinHeader_1x02_P2.54mm_Vertical", note: "buck output -> +3V3 rail"}

# Diagram blocks: which nets draw together, in signal-flow order.
blocks:
  "Staged-power links (bring-up)": [VIN_BUCK, 5V_BUCK, 3V3_BUCK]
  "Protection stage: J1 → VIN_PROT": [VIN_RAW, VIN_FUSED, VIN_PROT, Q1_GATE]
  "Rail 1: AP64350, VIN_PROT → +5V":  [BST_5V, SW_5V, +5V, FB_5V, RT_5V, COMP_5V, COMP_RC, LED_5V]
  "Rail 2: TLV62569, +5V → +3V3":     [SW_3V3, +3V3, FB_3V3, LED_3V3]

# Global nets (cross sheets — must carry exactly this label / power symbol):
#   GND +5V +3V3 : power symbols        VIN_RAW VIN_PROT : global labels
# Everything else is a local label or unlabeled; the checker matches by
# membership, so internal node names below are only for readability.

nets:
  # --- protection ---------------------------------------------------
  VIN_RAW:   [J1.1, J2.1, F1.1]
  VIN_FUSED: [F1.2, Q1.D]
  VIN_PROT:  [Q1.S, D_Z.K, D1.K, C_bulk.1, JP_VIN.1]
  VIN_BUCK:  [JP_VIN.2, C1a.1, C1b.1, U1.VIN, U1.EN]
  Q1_GATE:   [Q1.G, D_Z.A, R_G.1]

  # --- rail 1: AP64350 -> +5V  (listed in signal-flow order for the diagram)
  BST_5V:    [U1.BST, C3.1]
  SW_5V:     [U1.SW, C3.2, L1.1]
  5V_BUCK:   [L1.2, C2a.1, C2b.1, R1.1, C4.1, JP_5V.2]
  +5V:       [JP_5V.1, R_5V.1, U2.VIN, U2.EN, C_in.1]
  FB_5V:     [R1.2, R2.1, C4.2, U1.FB]
  RT_5V:     [U1.RT/CLK, RT.1]
  COMP_5V:   [U1.COMP, R5.1, C6.1]
  COMP_RC:   [R5.2, C5.1]
  LED_5V:    [R_5V.2, D_5V.A]

  # --- rail 2: TLV62569 -> +3V3 ------------------------------------
  SW_3V3:    [U2.SW, L2.1]
  3V3_BUCK:  [L2.2, C_out.1, R_FB1.1, C_FF.1, JP_3V3.2]
  +3V3:      [JP_3V3.1, R_3V3.1]
  FB_3V3:    [U2.FB, R_FB1.2, R_FB2.1, C_FF.2]
  LED_3V3:   [R_3V3.2, D_3V3.A]

  # --- ground ---------------------------------------------------------
  GND: [J1.2, J2.2, J2.3, R_G.2, D1.A, C1a.2, C1b.2, C_bulk.2, U1.GND, U1.EP,
        RT.2, R2.2, C5.2, C6.2, C2a.2, C2b.2, D_5V.K,
        U2.GND, C_in.2, C_out.2, R_FB2.2, D_3V3.K]
