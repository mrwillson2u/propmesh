# Sheet 05 — Addressable LED + status LED: connection spec. ONE LINE PER NET.
#
# Drawing guide: open 05-led.diagram.html.  Checker after capture:
#   python3 tools/checknet.py hardware/pro/sheets/05-led.net.yaml
#
# ONE OCTAL LEVEL SHIFTER (decided 2026-09-05, third and final revision):
# SN74AHCT541DWR, SOIC-20W, C2682058 ($0.44@100, 2.9 k stock). Eight
# non-inverting buffers in ONE ordinary 20-pin symbol — no multi-unit
# gates to place five times. Five buffers used, THREE SPARE (Y5-Y7) =
# free 5 V-level bodge points for v0.1 (solder straight to the SOIC pin).
# Replaced the SN74AHCT125 quad + SN74AHCT1G125 single-gate pair.
#
# THE SUFFIX IS THE POINT: 74AHCT — the T = TTL thresholds (VIH 2.0 V),
# which is what makes 3.3 V data legal into a 5 V buffer. AHC/HC at 5 V
# need 3.5 V and "mostly work" = random flicker (locked decision).
#
# 541 PINOUT (KiCad 74xx:74AHCT541 pin names; flow-through A<n> -> Y<n>):
#   G1  = 1   enable (active low)  -> GND
#   A0-A7 = 2-9   inputs            Y0-Y7 = 18-11 outputs (Y0 is pin 18)
#   GND = 10                         G2 = 19 enable (active low) -> GND
#   VCC = 20
# ASSIGNMENT:
#   A0 (2)  -> Y0 (18)  strip 1 DATA
#   A1 (3)  -> Y1 (17)  strip 1 CLK
#   A2 (4)  -> Y2 (16)  strip 2 DATA
#   A3 (5)  -> Y3 (15)  strip 2 CLK
#   A4 (6)  -> Y4 (14)  status pixel
#   A5-A7 (7-9) -> GND  (CMOS inputs must not float)
#   Y5-Y7 (13-11)       no-connect X flags — the spares
#
# BOTH STRIP OUTPUTS ARE 3- OR 4-WIRE: GPIO 3 came free when the onboard
# IR receiver was dropped (a receiver inside a hidden enclosure can't see
# a remote; plug-in IR goes on a DIGITAL_IN). Each strip = two DG128-02P
# blocks (5V|GND + DATA|CLK). 3- vs 4-wire is a FIRMWARE setting — NO
# mode jumper (dropped 2026-09-06: an empty CLK terminal needs no
# isolating, and the 330 R already limits a miswire to ~15 mA).
#
# 330 R series AT THE CONNECTOR (damps reflections into the cable, so
# it sits at the cable end, not the chip end). 1000 uF bulk at each
# strip's power block = hot-plug inrush for the first pixel (radial
# THT D10 P5, C439782 — GP electrolytic is fine: charge storage, not a
# switcher output; low-ESR alternate C165516, 750 stock).
#
# STATUS PIXEL: WS2812B-MINI-X2 (3.5 mm) — import verified against the
# Worldsemi DS 2026-09-04: symbol pins 1=DIN 2=VDD 3=DOUT 4=GND match
# the DS table; land pattern is the DS recommendation ~0.1-0.3 mm
# enlarged, same 0.5 mm gaps — fine. VIH = 0.65*VDD = 3.25 V at 5 V,
# which is WHY it hangs off a buffer and not the bare GPIO.
# DOUT (pin 3) gets a no-connect X flag.

sheet: 05-led

_fp: &fp
  r0603: &r0603 "Resistor_SMD:R_0603_1608Metric"
  c0603: &c0603 "Capacitor_SMD:C_0603_1608Metric"
  bulk:  &bulk  "Capacitor_THT:CP_Radial_D6.3mm_P2.50mm"
  dg2:   &dg2   "propmesh:CONN-TH_DG128-5.0-02P-14-00A-H"

parts:
  U_LS:   {value: SN74AHCT541, lcsc: C2682058, symbol: "74xx:74AHCT541", footprint: "Package_SO:SOIC-20W_7.5x12.8mm_P1.27mm", note: "octal buffer, ONE 20-pin symbol. AHCT, never AHC/HC — TTL thresholds are the level shift. Unused inputs A5-A7 to GND; spare outputs Y5-Y7 get no-connect flags"}
  C_LS:   {value: 100nF, lcsc: C14663, symbol: "Device:C", footprint: *c0603, note: "at U_LS VCC (pin 20), 5 V rail"}
  R_S1:   {value: 330R, lcsc: C23138, symbol: "Device:R", footprint: *r0603, note: "series Rs live AT THE CONNECTORS, not the chip"}
  R_S1C:  {value: 330R, lcsc: C23138, symbol: "Device:R", footprint: *r0603}
  R_S2D:  {value: 330R, lcsc: C23138, symbol: "Device:R", footprint: *r0603}
  R_S2C:  {value: 330R, lcsc: C23138, symbol: "Device:R", footprint: *r0603}
  R_ST:   {value: 330R, lcsc: C23138, symbol: "Device:R", footprint: *r0603, note: "status pixel is on-board but keeps its series R — costs nothing, kills ringing"}
  C_B1:   {value: 220uF/16V, lcsc: C88757, symbol: "Device:C_Polarized", footprint: *bulk, note: "hot-plug bulk at strip 1's power block. Was 1000 uF until 2026-09-16 (datasheet review decision 1A): 2 mF on +5V made the AP64350 hit its 4.25 A peak limit through its 2 ms soft-start and hiccup. Rubycon 16YXJ220M6.3X11, D6.3xL11 P2.5, 220 mOhm @100 kHz, 400 mA ripple, 7000 h @105 C"}
  C_B2:   {value: 220uF/16V, lcsc: C88757, symbol: "Device:C_Polarized", footprint: *bulk, note: "same, strip 2"}
  R_PD1:  {value: 10k, lcsc: C25804, symbol: "Device:R", footprint: *r0603, note: "input pulldown (2026-09-16): U_LS inputs must not float while the MCU is in reset — TI requires defined CMOS input levels. Strip data held LOW at boot = no garbage frame"}
  R_PD2:  {value: 10k, lcsc: C25804, symbol: "Device:R", footprint: *r0603}
  R_PD3:  {value: 10k, lcsc: C25804, symbol: "Device:R", footprint: *r0603}
  R_PD4:  {value: 10k, lcsc: C25804, symbol: "Device:R", footprint: *r0603, note: "LED_STRIP_1_CLK's pulldown is R_STRAP3 on sheet 08, now fitted"}
  J_ST1A: {value: LED1_PWR, lcsc: C711349, symbol: "Connector:Screw_Terminal_01x02", footprint: *dg2, note: "strip 1 power half: 5V | GND. Silk: strips beyond ~50 px need external 5 V injection, data-only from the board"}
  J_ST1B: {value: LED1_SIG, lcsc: C711349, symbol: "Connector:Screw_Terminal_01x02", footprint: *dg2, note: "strip 1 signal half: DATA | CLK"}
  J_ST2A: {value: LED2_PWR, lcsc: C711349, symbol: "Connector:Screw_Terminal_01x02", footprint: *dg2, note: "strip 2 power half: 5V | GND"}
  J_ST2B: {value: LED2_SIG, lcsc: C711349, symbol: "Connector:Screw_Terminal_01x02", footprint: *dg2, note: "strip 2 signal half: DATA | CLK"}
  D_ST:   {value: WS2812B-MINI, lcsc: C4154873, symbol: "propmesh:WS2812B-MINI-X1", footprint: "propmesh:LED-SMD_4P-L3.5-W3.5-TL_WS2812B-1", note: "symbol name is the vendor's; the taped part ordered is -X2. Pin 3 DOUT gets a no-connect X"}
  C_ST:   {value: 100nF, lcsc: C14663, symbol: "Device:C", footprint: *c0603, note: "at D_ST VDD"}

blocks:
  "Level shifter — inputs (A side)": [LED_STRIP_1_DATA, LED_STRIP_1_CLK, LED_STRIP_2_DATA, LED_STRIP_2_CLK, STATUS_LED]
  "Strip 1 (3/4-wire)":              [LED1_5V, LED1_OUT, CLK1_5V, CLK1_OUT]
  "Strip 2 (3/4-wire)":              [LED2_5V, LED2_OUT, CLK2_5V, CLK2_OUT]
  "Status pixel":                    [ST_5V, ST_DIN]

named: [LED_STRIP_1_DATA, LED_STRIP_1_CLK, LED_STRIP_2_DATA, LED_STRIP_2_CLK, STATUS_LED]

nets:
  # --- buffer inputs (MCU drives these from sheet 02) -----------------
  LED_STRIP_1_DATA: [U_LS.A0, R_PD1.1]
  LED_STRIP_1_CLK:  [U_LS.A1]
  LED_STRIP_2_DATA: [U_LS.A2, R_PD2.1]
  LED_STRIP_2_CLK:  [U_LS.A3, R_PD3.1]
  STATUS_LED:       [U_LS.A4, R_PD4.1]

  # --- strip 1 --------------------------------------------------------
  LED1_5V:  [U_LS.Y0, R_S1.1]
  LED1_OUT: [R_S1.2, J_ST1B.1]
  CLK1_5V:  [U_LS.Y1, R_S1C.1]
  CLK1_OUT: [R_S1C.2, J_ST1B.2]

  # --- strip 2 --------------------------------------------------------
  LED2_5V:  [U_LS.Y2, R_S2D.1]
  LED2_OUT: [R_S2D.2, J_ST2B.1]
  CLK2_5V:  [U_LS.Y3, R_S2C.1]
  CLK2_OUT: [R_S2C.2, J_ST2B.2]

  # --- status pixel ---------------------------------------------------
  ST_5V:  [U_LS.Y4, R_ST.1]
  ST_DIN: [R_ST.2, D_ST.1]

  # --- rails ----------------------------------------------------------
  +5V: [U_LS.VCC, C_LS.1, J_ST1A.1, J_ST2A.1, C_B1.1, C_B2.1, D_ST.2, C_ST.1]
  GND: [U_LS.GND, U_LS.G1, U_LS.G2, U_LS.A5, U_LS.A6, U_LS.A7, C_LS.2,
        J_ST1A.2, J_ST2A.2, C_B1.2, C_B2.2, D_ST.4, C_ST.2,
        R_PD1.2, R_PD2.2, R_PD3.2, R_PD4.2]
