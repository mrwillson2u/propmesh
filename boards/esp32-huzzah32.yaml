# Adafruit HUZZAH32 — ESP32 Feather (ESP32-WROOM-32) — generic-board profile.
#
# Edit, then run:  python3 tools/genboards.py
# Never hand-edit boards_gen.h / boards_gen.ts.
#
# Same rules as esp32-devkit-v1.yaml: caps / tier / best are what each pin
# CAN do and what to warn about; the user assigns functions in the console.
#
# Why this board: the Feather has a LiPo JST input with a 500 mA charger
# and a battery-voltage divider, so it stands in for the battery Mini's
# story (leaf node, sleep discipline) on a board you can buy today.
#
# ⚠ Battery life, as bought: the CP2104 USB-serial chip runs from the
# 3.3 V rail, so it is powered on battery too, and with no USB host its
# D− line floats and it never enters USB suspend — ~6.5 mA around the
# clock, deep sleep included (pantaluna's HUZZAH32 notes; TvE's blog,
# 2018). FIX: a pull-down resistor from USB D− to GND (the CP2104's D−
# pin, or the D− pad of the micro-USB connector) puts it in suspend;
# TvE measured the whole board at ~200–250 µA afterwards. He did not
# give the value — 10–100 kΩ is the usual range, and the resistor must
# not stop USB working when a host IS attached (a host drives D−, so a
# weak pull-down is harmless). Confirm with the meter before and after.
# The Feather V2 (ESP32-PICO) has no such chip and sits at ~420 µA.
#
# Sources: Adafruit HUZZAH32 pinout page (learn.adafruit.com/adafruit-huzzah32-esp32-feather/pinouts),
# ESP32 datasheet §2.2 / §2.4. ⚠ VERIFY against the silkscreen of the board
# in hand before trusting a pin: Feather labels (A0…A5, SCK, MO, MI) map to
# GPIO numbers as below on the standard HUZZAH32; the V2 (ESP32-PICO) differs.

id: esp32-huzzah32
name: Adafruit HUZZAH32 Feather
mcu: ESP32-WROOM-32
board_type: HUZZAH32         # BoardType in schema/messages.yaml
ledc_channels: 16
rmt_tx_channels: 8

# Battery: VBAT through a 2:1 divider on GPIO 35 (Feather "A13"), read by
# the firmware for the heartbeat's battery_mv. Not assignable in the console.
battery:
  gpio: 35
  divider: 2.0

guide:
  SERVO: "Quiet at power-up, so nothing twitches while the board boots."
  MOTOR: "A quiet pair side by side for IN1 / IN2 — a motor never lurches at boot."
  RELAY: "Quiet at power-up, so a relay never clicks on during boot."
  LED_STRIP: "Any output can drive a strip. The Feather is 3.3 V with no 5 V pin when on battery — a 5 V strip needs its own supply and a level shifter."
  LED: "GPIO 13 is the onboard red LED. The boot-quirk pins (5, 12, 15) suit a light, where a flicker at power-up doesn't matter."
  DIGITAL_IN: "A2 / A3 / A4 (GPIO 34 / 39 / 36) are input-only with no pull — fine for PIR and beam sensors. Buttons go on 32 / 33 / 27, which have internal pull-ups. On battery the wake-up sensor goes on one of these."

pins:
  # left header (USB end to the right), analog side
  - {gpio: 26, label: A0,  caps: [in, out, pullup, pulldown, wake], tier: good, best: SERVO, also: [MOTOR, RELAY, LED], note: "also DAC2"}
  - {gpio: 25, label: A1,  caps: [in, out, pullup, pulldown, wake], tier: good, best: SERVO, also: [MOTOR, RELAY, LED], note: "also DAC1"}
  - {gpio: 34, label: A2,  caps: [in, adc, wake], tier: good, best: DIGITAL_IN, note: "input only, no internal pull — a button here needs an external resistor"}
  - {gpio: 39, label: A3,  caps: [in, adc, wake], tier: good, best: DIGITAL_IN, note: "input only, no internal pull — a button here needs an external resistor"}
  - {gpio: 36, label: A4,  caps: [in, adc, wake], tier: good, best: DIGITAL_IN, note: "input only, no internal pull — a button here needs an external resistor"}
  - {gpio: 4, label: A5,  caps: [in, out, pullup, pulldown, adc, wake], tier: good, best: SERVO, also: [RELAY, MOTOR]}
  - {gpio: 5, label: SCK, caps: [out], tier: caution, best: LED, also: [LED_STRIP], note: "STRAPPING: pulled high and pulses at power-up — fine for an LED or strip, not for a relay or motor"}
  - {gpio: 18, label: MO,  caps: [in, out, pullup, pulldown], tier: good, best: MOTOR, also: [SERVO, RELAY]}
  - {gpio: 19, label: MI,  caps: [in, out, pullup, pulldown], tier: good, best: MOTOR, also: [SERVO, RELAY]}
  - {gpio: 16, label: RX,  caps: [in, out, pullup, pulldown], tier: good, best: LED_STRIP, also: [RELAY, SERVO, LED]}
  - {gpio: 17, label: TX,  caps: [in, out, pullup, pulldown], tier: good, best: LED_STRIP, also: [RELAY, SERVO, LED]}
  - {gpio: 21, label: "21", caps: [in, out, pullup, pulldown], tier: good, best: RELAY, also: [SERVO, MOTOR]}
  # right header
  - {gpio: 23, label: SDA, caps: [in, out, pullup, pulldown], tier: good, best: RELAY, also: [SERVO, MOTOR]}
  - {gpio: 22, label: SCL, caps: [in, out, pullup, pulldown], tier: good, best: RELAY, also: [SERVO, MOTOR]}
  - {gpio: 14, label: "14", caps: [in, out, pullup, pulldown, wake], tier: caution, best: LED, also: [LED_STRIP], note: "pulses briefly at power-up — a relay or motor here may twitch on boot"}
  - {gpio: 32, label: "32", caps: [in, out, pullup, pulldown, adc, wake], tier: good, best: DIGITAL_IN, also: [SERVO, RELAY]}
  - {gpio: 15, label: "15", caps: [out], tier: caution, best: LED, also: [LED_STRIP], note: "STRAPPING: pulled high and pulses at power-up — fine for an LED or strip, not for a relay or motor"}
  - {gpio: 33, label: "33", caps: [in, out, pullup, pulldown, adc, wake], tier: good, best: DIGITAL_IN, also: [SERVO, RELAY]}
  - {gpio: 27, label: "27", caps: [in, out, pullup, pulldown, wake], tier: good, best: SERVO, also: [MOTOR, RELAY, LED]}
  - {gpio: 12, label: "12", caps: [out], tier: caution, best: LED, note: "STRAPPING: must be LOW at power-up or the board will not boot. Outputs only, and nothing that pulls it high (many relay modules do)"}
  - {gpio: 13, label: "13", caps: [in, out, pullup, pulldown, wake], tier: caution, best: LED, also: [LED_STRIP], note: "the onboard red LED shares this pin, and it pulses at power-up — a light, not a relay or motor"}
  # not on the headers but worth knowing
  - {gpio: 35, label: A13, caps: [], tier: reserved, note: "battery voltage (VBAT/2) — read by the firmware for the battery gauge"}
  - {gpio: 1, label: TX0, caps: [], tier: reserved, note: "USB serial — the console and the flasher live here"}
  - {gpio: 3, label: RX0, caps: [], tier: reserved, note: "USB serial — the console and the flasher live here"}
