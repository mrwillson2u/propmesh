# ESP32 DevKit V1 (DOIT, 30-pin, ESP32-WROOM-32) — generic-board profile.
#
# Edit, then run:  python3 tools/genboards.py
# Never hand-edit boards_gen.h / boards_gen.ts.
#
# This is NOT a pin assignment (that is what the user does in the
# console) — it is what each pin is ABLE to do, and what to warn about.
#
# caps:  in, out, pullup, pulldown, adc, wake (can wake from deep sleep)
# best:  the use this pin is recommended for; also: other good uses.
#        Advice only — the console shows it as a pin guide and ★ in the
#        dropdowns; the rules that block or warn are caps + tier.
#        genboards checks every recommendation is something the pin can do.
# tier:  good     — offered first, no caveats
#        caution  — usable, but the note is shown as a warning
#        reserved — listed so the UI can explain why, never assignable
#
# Sources: ESP32 datasheet §2.2 pin table + §2.4 strapping pins,
# ESP32-WROOM-32 datasheet (GPIO 6-11 = module flash). ⚠ The boot-time
# behavior notes on 5/14/15 are from the datasheet's power-up glitch
# table and bench folklore — confirm on a scope before a relay goes on one.

id: esp32-devkit-v1
name: ESP32 DevKit V1 (30-pin)
mcu: ESP32-WROOM-32
board_type: DEVKIT            # BoardType in schema/messages.yaml
# How far this board has been tried on real hardware — shown on the docs
# site's board pages (tested / partial / untested). Update it after a bench test.
status: tested
status_note: "Runs the project's own yard: bridge and prop boards, the mesh, sequences, triggers, schedule, floods and over-the-air updates."
ledc_channels: 16
rmt_tx_channels: 8
pinout_url: https://randomnerdtutorials.com/esp32-pinout-reference-gpios/

# The two headers as printed, top to bottom with the USB socket at the
# bottom — drawn by the console's pinout diagram. Every GPIO label above
# must appear; the rest are power and control pins.
header:
  usb: bottom
  left:  [EN, VP, VN, D34, D35, D32, D33, D25, D26, D27, D14, D12, D13, GND, VIN]
  right: [D23, D22, TX0, RX0, D21, D19, D18, D5, TX2, RX2, D4, D2, D15, GND, 3V3]

# Why the recommended pins, per function — shown in the console's guide.
guide:
  SERVO: "Quiet at power-up, so nothing twitches while the board boots."
  MOTOR: "A quiet pair side by side for IN1 / IN2 — a motor never lurches at boot."
  RELAY: "Quiet at power-up, so a relay never clicks on during boot."
  LED_STRIP: "Any output can drive a strip; these keep strips together. Use a 74AHCT-type level shifter for 5 V strips."
  LED: "The boot-quirk pins — a flicker at power-up doesn't matter for a light, and it keeps the quiet pins free. D2 is the onboard blue LED."
  DIGITAL_IN: "Input-only pins don't use up outputs. VP / VN / D34 / D35 have no pull resistor — fine for PIR and beam sensors, which drive their own output. Buttons go on D32 / D33, which have internal pull-ups."

pins:
  # left header, top (EN end) to bottom
  - {gpio: 36, label: VP,  caps: [in, adc, wake], tier: good, best: DIGITAL_IN, note: "input only, no internal pull — a button here needs an external resistor"}
  - {gpio: 39, label: VN,  caps: [in, adc, wake], tier: good, best: DIGITAL_IN, note: "input only, no internal pull — a button here needs an external resistor"}
  - {gpio: 34, label: D34, caps: [in, adc, wake], tier: good, best: DIGITAL_IN, note: "input only, no internal pull — a button here needs an external resistor"}
  - {gpio: 35, label: D35, caps: [in, adc, wake], tier: good, best: DIGITAL_IN, note: "input only, no internal pull — a button here needs an external resistor"}
  - {gpio: 32, label: D32, caps: [in, out, pullup, pulldown, adc, wake], tier: good, best: DIGITAL_IN, also: [SERVO, RELAY]}
  - {gpio: 33, label: D33, caps: [in, out, pullup, pulldown, adc, wake], tier: good, best: DIGITAL_IN, also: [SERVO, RELAY]}
  - {gpio: 25, label: D25, caps: [in, out, pullup, pulldown, wake], tier: good, best: SERVO, also: [MOTOR, RELAY, LED]}
  - {gpio: 26, label: D26, caps: [in, out, pullup, pulldown, wake], tier: good, best: SERVO, also: [MOTOR, RELAY, LED]}
  - {gpio: 27, label: D27, caps: [in, out, pullup, pulldown, wake], tier: good, best: SERVO, also: [MOTOR, RELAY, LED]}
  - {gpio: 14, label: D14, caps: [in, out, pullup, pulldown, wake], tier: caution, best: LED, also: [LED_STRIP], note: "pulses briefly at power-up — a relay or motor here may twitch on boot"}
  - {gpio: 12, label: D12, caps: [out], tier: caution, best: LED, note: "STRAPPING: must be LOW at power-up or the board will not boot. Outputs only, and nothing that pulls it high (many relay modules do)"}
  - {gpio: 13, label: D13, caps: [in, out, pullup, pulldown, wake], tier: good, best: SERVO, also: [RELAY, MOTOR]}
  # right header, top to bottom
  - {gpio: 23, label: D23, caps: [in, out, pullup, pulldown], tier: good, best: RELAY, also: [SERVO, MOTOR]}
  - {gpio: 22, label: D22, caps: [in, out, pullup, pulldown], tier: good, best: RELAY, also: [SERVO, MOTOR]}
  - {gpio: 1, label: TX0, caps: [], tier: reserved, note: "USB serial — the console and the flasher live here"}
  - {gpio: 3, label: RX0, caps: [], tier: reserved, note: "USB serial — the console and the flasher live here"}
  - {gpio: 21, label: D21, caps: [in, out, pullup, pulldown], tier: good, best: RELAY, also: [SERVO, MOTOR]}
  - {gpio: 19, label: D19, caps: [in, out, pullup, pulldown], tier: good, best: MOTOR, also: [SERVO, RELAY]}
  - {gpio: 18, label: D18, caps: [in, out, pullup, pulldown], tier: good, best: MOTOR, also: [SERVO, RELAY]}
  - {gpio: 5, label: D5,  caps: [out], tier: caution, best: LED, also: [LED_STRIP], note: "STRAPPING: pulled high and pulses at power-up — fine for an LED or strip, not for a relay or motor"}
  - {gpio: 17, label: TX2, caps: [in, out, pullup, pulldown], tier: good, best: LED_STRIP, also: [RELAY, SERVO, LED]}
  - {gpio: 16, label: RX2, caps: [in, out, pullup, pulldown], tier: good, best: LED_STRIP, also: [RELAY, SERVO, LED]}
  - {gpio: 4, label: D4,  caps: [in, out, pullup, pulldown, wake], tier: good, best: SERVO, also: [RELAY, MOTOR]}
  - {gpio: 2, label: D2,  caps: [out], tier: caution, best: LED, note: "STRAPPING + the onboard blue LED. Outputs only; anything holding it high blocks flashing"}
  - {gpio: 15, label: D15, caps: [out], tier: caution, best: LED, also: [LED_STRIP], note: "STRAPPING: pulled high and pulses at power-up — fine for an LED or strip, not for a relay or motor"}
